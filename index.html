<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Victor Card 勤美卡牌市集官方網站" />
  <meta name="theme-color" content="#080808" />
  <title>Victor Card｜勤美卡牌市集</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">

</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <main class="page-shell">
    <section class="hero">
      <div class="brand-mark" aria-label="Victor Card 標誌">
        <span class="crown">♛</span>
        <span class="v">V</span>
      </div>

      <p class="eyebrow">VICTOR CARD</p>
      <h1>勤美卡牌市集</h1>
      <p class="tagline">收藏・交流・市集</p>

      <div class="divider"></div>

      <section class="event-card" aria-labelledby="event-title">
        <p class="section-kicker">本週活動</p>
        <h2 id="event-title" data-config="eventTitle">本週六日攤位報名</h2>
        <p class="event-date" data-config="eventDate">請點下方按鈕查看最新場次</p>
        <a class="primary-button" data-link="booking" href="#" target="_blank" rel="noopener">
          <span>📅</span>
          <span>立即報名</span>
        </a>
      </section>

      <nav class="link-grid" aria-label="官方連結">
        <a class="link-card" data-link="line" href="#" target="_blank" rel="noopener">
          <span class="icon">💬</span>
          <span class="link-copy">
            <strong>官方 LINE</strong>
            <small>@victor7717</small>
          </span>
        </a>

        <a class="link-card" data-link="map" href="#" target="_blank" rel="noopener">
          <span class="icon">📍</span>
          <span class="link-copy">
            <strong>Google 地圖</strong>
            <small>查看交通位置</small>
          </span>
        </a>

        <a class="link-card" data-link="instagram" href="#" target="_blank" rel="noopener">
          <span class="icon">📸</span>
          <span class="link-copy">
            <strong>Instagram</strong>
            <small>最新活動與卡牌資訊</small>
          </span>
        </a>

        <a class="link-card" data-link="facebook" href="#" target="_blank" rel="noopener">
          <span class="icon">👍</span>
          <span class="link-copy">
            <strong>Facebook</strong>
            <small>追蹤官方公告</small>
          </span>
        </a>
      </nav>

      <section class="info-panel">
        <div>
          <span class="info-label">營業時間</span>
          <strong data-config="hours">每週六、日 11:00～18:00</strong>
        </div>
        <div>
          <span class="info-label">地址</span>
          <strong data-config="address">台中市西區公益路155巷9號6樓之一</strong>
        </div>
      </section>

      <footer>
        <span>© <span id="year"></span> Victor Card</span>
        <span>victorcard.tw</span>
      </footer>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
